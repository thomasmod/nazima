<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazima Saidova's Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --void: #05050c;
            --deep-space: #0a0b1c;
            --nebula-violet: #7c5cff;
            --nebula-teal: #22d3c7;
            --nebula-rose: #ff6fa5;
            --surface: rgba(20, 21, 43, 0.55);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f2fb;
            --text-secondary: #a8a6c8;
            --elevation-1: 0 1px 2px rgba(0,0,0,0.4), 0 4px 24px rgba(124, 92, 255, 0.12);
            --elevation-2: 0 4px 16px rgba(0,0,0,0.5), 0 8px 40px rgba(124, 92, 255, 0.22);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 20% 15%, #14163a 0%, transparent 55%),
                        radial-gradient(ellipse at 85% 75%, #1a1230 0%, transparent 50%),
                        var(--void);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 24px;
        }

        /* ---------- Cosmos background layers ---------- */
        #stars-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
        }

        .nebula-glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .nebula-glow span {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: drift 40s ease-in-out infinite alternate;
        }

        .nebula-glow span:nth-child(1) {
            width: 480px; height: 480px;
            background: var(--nebula-violet);
            top: -10%; left: -8%;
            animation-duration: 46s;
        }

        .nebula-glow span:nth-child(2) {
            width: 420px; height: 420px;
            background: var(--nebula-teal);
            bottom: -12%; right: -6%;
            animation-duration: 52s;
            animation-delay: -12s;
        }

        .nebula-glow span:nth-child(3) {
            width: 300px; height: 300px;
            background: var(--nebula-rose);
            top: 40%; right: 15%;
            opacity: 0.18;
            animation-duration: 38s;
            animation-delay: -20s;
        }

        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(6%, 8%) scale(1.12); }
            100% { transform: translate(-5%, -4%) scale(0.96); }
        }

        /* ---------- Card ---------- */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 28px;
            padding: 40px 32px;
            text-align: center;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: var(--elevation-2);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--nebula-teal);
            margin-bottom: 14px;
        }

        .eyebrow .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--nebula-teal);
            box-shadow: 0 0 8px var(--nebula-teal);
            animation: pulse 2.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: clamp(1.7rem, 4vw, 2.4rem);
            margin: 0 0 8px;
            background: linear-gradient(135deg, #ffffff 30%, var(--nebula-teal) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin: 0 0 32px;
        }

        /* ---------- Material-style buttons ---------- */
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border: 1px solid var(--surface-border);
            padding: 12px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            transition: background-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .button .icon {
            margin-right: 8px;
            font-size: 1rem;
        }

        .button:hover {
            background: rgba(124, 92, 255, 0.18);
            border-color: rgba(124, 92, 255, 0.5);
            box-shadow: var(--elevation-1);
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(0) scale(0.97);
        }

        .button:focus-visible {
            outline: 2px solid var(--nebula-teal);
            outline-offset: 2px;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: ripple-anim 0.6s ease-out;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes ripple-anim {
            to { transform: scale(3); opacity: 0; }
        }

        @media (max-width: 480px) {
            .card { padding: 32px 20px; border-radius: 22px; }
            .button { padding: 11px 16px; font-size: 0.86rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .nebula-glow span, .eyebrow .dot { animation: none !important; }
        }
    </style>
    <script>
        function copyEmail() {
            var emailText = "foreverbeatific@yandex.com";
            navigator.clipboard.writeText(emailText);
            alert("Yandex.Mail copied: " + emailText);
        }

        function copyEmail2() {
            var emailText = "saidovanozima30@gmail.com";
            navigator.clipboard.writeText(emailText);
            alert("Google g-mail copied: " + emailText);
        }

        function spawnRipple(e) {
            var btn = e.currentTarget;
            var rect = btn.getBoundingClientRect();
            var ripple = document.createElement('span');
            var size = Math.max(rect.width, rect.height);
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ripple);
            setTimeout(function () { ripple.remove(); }, 650);
        }

        window.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.button').forEach(function (btn) {
                btn.addEventListener('click', spawnRipple);
            });
        });
    </script>
</head>

<body>
    <canvas id="stars-canvas"></canvas>
    <div class="nebula-glow">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="card">
        <div class="eyebrow"><span class="dot"></span> online now</div>
        <h1>Nazima Saidova's Page</h1>
        <p class="subtitle">her ideology</p>

        <div class="button-container">
            <div class="button-group">
                <a href="https://t.me/nazi_said" target="_blank" class="button">
                    <i class="fab fa-telegram icon"></i>Telegram
                </a>
                <a href="https://www.instagram.com/saidova_nazima_" target="_blank" class="button">
                    <i class="fab fa-instagram icon"></i>Instagram
                </a>
                <a href="javascript:void(0);" onclick="copyEmail()" class="button">

                </a>

            <div class="button-group">
                <a href="https://www.facebook.com/profile.php?id=100072316555817&mibextid=ZbWKwL" target="_blank" class="button">
                    <i class="fab fa-facebook icon"></i>Facebook
                </a>
                <a href="https://open.spotify.com/user/3132asoprmdheafjuszuqnrc3k5q?si=l-ORluqbRWWrFIoVC65OKw" target="_blank" class="button">
                    <i class="fab fa-spotify icon"></i>Spotify
                </a>
                <a href="javascript:void(0);" onclick="copyEmail2()" class="button">
                    <i class="fas fa-envelope icon"></i>Google g-mail
                </a>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var canvas = document.getElementById('stars-canvas');
            var ctx = canvas.getContext('2d');
            var stars = [];
            var shootingStars = [];
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var w, h, dpr;

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = window.innerWidth;
                h = window.innerHeight;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                buildStars();
            }

            function buildStars() {
                var count = Math.floor((w * h) / 2600);
                stars = [];
                for (var i = 0; i < count; i++) {
                    var depth = Math.random();
                    stars.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        r: 0.4 + depth * 1.4,
                        baseAlpha: 0.25 + depth * 0.6,
                        phase: Math.random() * Math.PI * 2,
                        speed: 0.4 + Math.random() * 1.1,
                        drift: (Math.random() - 0.5) * 0.02,
                        hue: Math.random() < 0.12 ? (Math.random() < 0.5 ? '178,216,255' : '255,214,190') : '255,255,255'
                    });
                }
            }

            function maybeSpawnShootingStar() {
                if (reduceMotion) return;
                if (Math.random() < 0.006 && shootingStars.length < 2) {
                    var startX = Math.random() * w * 0.6 + w * 0.2;
                    shootingStars.push({
                        x: startX,
                        y: -20,
                        vx: 4 + Math.random() * 3,
                        vy: 3 + Math.random() * 2,
                        life: 1,
                        len: 80 + Math.random() * 60
                    });
                }
            }

            function draw(t) {
                ctx.clearRect(0, 0, w, h);

                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    var twinkle = reduceMotion ? 1 : (0.55 + 0.45 * Math.sin(t * 0.001 * s.speed + s.phase));
                    ctx.beginPath();
                    ctx.fillStyle = 'rgba(' + s.hue + ',' + (s.baseAlpha * twinkle).toFixed(3) + ')';
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();

                    if (!reduceMotion) {
                        s.x += s.drift;
                        if (s.x < 0) s.x = w; if (s.x > w) s.x = 0;
                    }
                }

                maybeSpawnShootingStar();
                for (var j = shootingStars.length - 1; j >= 0; j--) {
                    var sh = shootingStars[j];
                    var tailX = sh.x - sh.vx * (sh.len / 10);
                    var tailY = sh.y - sh.vy * (sh.len / 10);
                    var grad = ctx.createLinearGradient(sh.x, sh.y, tailX, tailY);
                    grad.addColorStop(0, 'rgba(255,255,255,' + sh.life + ')');
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(sh.x, sh.y);
                    ctx.lineTo(tailX, tailY);
                    ctx.stroke();

                    sh.x += sh.vx * 4;
                    sh.y += sh.vy * 4;
                    sh.life -= 0.012;
                    if (sh.life <= 0 || sh.x > w + 50 || sh.y > h + 50) {
                        shootingStars.splice(j, 1);
                    }
                }

                requestAnimationFrame(draw);
            }

            window.addEventListener('resize', resize);
            resize();
            requestAnimationFrame(draw);
        })();
    </script>
</body>

</html>
