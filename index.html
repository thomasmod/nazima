<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazima Saidova's Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #A7D397;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: #ffffff;
            position: relative;
        }

        .animated-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            animation: moveCircles 10s infinite alternate ease-in-out;
        }

        .circle:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 20%;
        }

        .circle:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 50%;
            left: 70%;
        }

        .circle:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 80%;
            left: 40%;
        }

        .circle:nth-child(4) {
            width: 120px;
            height: 120px;
            top: 30%;
            left: 90%;
        }

        @keyframes moveCircles {
            0% {
                transform: translateY(0) translateX(0);
            }
            100% {
                transform: translateY(100px) translateX(100px);
            }
        }

        .container {
            background-color: #D4E7C5;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(57, 163, 85, 0.6);
            width: 80%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            color: #4C704C;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .button-group {
            display: flex;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button {
            background-color: #82B366;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            margin: 5px;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .button:hover {
            background-color: #5A9A5A;
            transform: scale(1.05);
        }

        .button .icon {
            margin-right: 8px;
        }
    </style>
    <script>
        function copyEmail() {
            var emailText = "foreverbeatific@yandex.com";
            navigator.clipboard.writeText(emailText);
            alert("Yandex.Mail copied: " + emailText);
        }

        function copyEmail2() {
            var emailText = "anotheremail@example.com";
            navigator.clipboard.writeText(emailText);
            alert("Google g-mail copied: " + emailText);
        }
    </script>
</head>

<body>
    <div class="animated-background">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="container">
        <h1>Nazima Saidova's Page</h1>

        <div class="button-container">
            <div class="button-group">
                <a href="https://t.me/saidova_nazima" target="_blank" class="button">
                    <i class="fab fa-telegram icon"></i>Telegram
                </a>
                <a href="https://www.instagram.com/saidova_nazima_" target="_blank" class="button">
                    <i class="fab fa-instagram icon"></i>Instagram
                </a>
                <a href="javascript:void(0);" onclick="copyEmail()" class="button">
                    <i class="fas fa-envelope icon"></i>Yandex-Mail
                </a>
            </div>

            <div class="button-group">
                <a href="https://www.facebook.com/profile.php?id=100072316555817&mibextid=ZbWKwL" target="_blank" class="button">
                    <i class="fab fa-facebook icon"></i>Facebook
                </a>
                <a href="https://open.spotify.com/user/3132asoprmdheafjuszuqnrc3k5q?si=l-ORluqbRWWrFIoVC65OKw" target="_blank" class="button">
                    <i class="fab fa-spotify icon"></i>Spotify
                </a>
                <a href="javascript:void(0);" onclick="copyEmail2()" class="button">
                    <i class="fas fa-envelope icon"></i>Google g-mail
                </a>
            </div>
        </div>
    </div>
</body>

</html>
